name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: logdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d logdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ingestion dependencies
        run: pip install -r ingestion/requirements.txt

      - name: Install ml dependencies
        run: pip install -r ml/requirements.txt

      - name: Install generator dependencies
        run: pip install -r generator/requirements.txt

      - name: Compile check (syntax errors)
        run: |
          python -m py_compile ingestion/*.py
          python -m py_compile ml/*.py
          python -m py_compile generator/*.py
          python -m py_compile dashboard/*.py

      - name: Run ml unit tests
        run: cd ml && python -m pytest tests/ -v

      - name: Run generator unit tests
        run: cd generator && python -m pytest tests/ -v

      - name: Run ingestion unit tests
        env:
          DATABASE_URL: postgresql://admin:admin123@localhost:5432/logdb
        run: cd ingestion && python -m pytest tests/ -v