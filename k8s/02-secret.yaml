# NOTE: This is a template with placeholder/example values for local
# testing convenience only. Real deployments should generate this via
# `kubectl create secret generic app-secrets --from-literal=...` and
# never commit actual secret values to git.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: log-anomaly
type: Opaque
stringData:
  POSTGRES_USER: "admin"
  POSTGRES_PASSWORD: "admin123"
  DATABASE_URL: "postgresql://admin:admin123@postgres:5432/logdb"
  DASHBOARD_PASSWORD: "changeme"
  SLACK_WEBHOOK_URL: ""
